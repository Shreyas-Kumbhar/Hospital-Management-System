<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Prescription Details – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="detail-page">

<div class="detail-card">
    <div class="detail-card-header">
        <div class="detail-icon">💊</div>
        <h2>Prescription Details</h2>
    </div>

    <div class="detail-accent teal">
        <div class="detail-row">
            <span class="detail-label">ID</span>
            <span class="detail-value" th:text="${prescription.id}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Medicine</span>
            <span class="detail-value">
                <span class="badge badge-teal" th:text="${prescription.medicine}"></span>
            </span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Dosage</span>
            <span class="detail-value">
                <span class="badge badge-green" th:text="${prescription.dosage}"></span>
            </span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Notes</span>
            <span class="detail-value" th:text="${prescription.notes}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Appointment</span>
            <span class="detail-value">
                <span class="badge badge-gray"
                      th:text="${prescription.appointment != null ? 'Appt #' + prescription.appointment.id : 'N/A'}">
                </span>
            </span>
        </div>
    </div>

    <div class="detail-actions">
        <a class="btn btn-outline" th:href="@{/prescription/list}">← Back</a>
        <a class="btn btn-warning" th:href="@{'/prescription/edit/' + ${prescription.id}}">✏️ Edit</a>
        <a class="btn btn-primary" th:href="@{/dashboard}">🏠 Dashboard</a>
    </div>
</div>

</body>
</html>
