<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Prescription Details</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef5ff, #eaf2ff);
            margin: 0;
            animation: fadeInPage 0.8s ease;
        }

        /* container */
        .container {
            width: 460px;
            margin: 70px auto;
            text-align: center;
            animation: slideUp 0.6s ease;
        }

        /* heading */
        h2 {
            color: #2c3e50;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* card */
        .card {
            background: rgba(255,255,255,0.95);
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            text-align: left;
            border-left: 5px solid #16a085;
            backdrop-filter: blur(6px);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.18);
        }

        /* rows */
        .card p {
            margin: 14px 0;
            font-size: 15px;
            color: #444;
            line-height: 1.5;
        }

        /* labels */
        .card b {
            color: #2c3e50;
            display: inline-block;
            width: 130px;
        }

        /* highlights */
        .highlight {
            background: #e8f8f5;
            color: #117a65;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .notes {
            display: inline-block;
            background: #f4f6f7;
            padding: 6px 10px;
            border-radius: 6px;
            color: #555;
        }

        /* button */
        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: linear-gradient(135deg, #16a085, #138d75);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(22,160,133,0.4);
        }

        .button:active {
            transform: scale(0.95);
        }

        /* animations */
        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

    </style>
</head>

<body>

<div class="container">

    <h2>💊 Prescription Details</h2>

    <div class="card">

        <p><b>ID:</b> <span th:text="${prescription.id}"></span></p>

        <p><b>Medicine:</b>
            <span class="highlight" th:text="${prescription.medicine}"></span>
        </p>

        <p><b>Dosage:</b>
            <span class="highlight" th:text="${prescription.dosage}"></span>
        </p>

        <p><b>Notes:</b>
            <span class="notes" th:text="${prescription.notes}"></span>
        </p>

        <p><b>Appointment:</b>
            <span th:text="${prescription.appointment.id}"></span>
        </p>

    </div>

    <a class="button" th:href="@{/prescription/list}">← Back</a>

</div>

</body>
</html>
