<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctors List</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef5ff, #eaf2ff);
            margin: 0;
            animation: fadeInPage 0.8s ease;
        }

        /* ===== TOP BAR ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .dashboard-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #3498db, #2c80b4);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .dashboard-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(52,152,219,0.4);
        }

        /* ===== CONTAINER ===== */
        .container {
            width: 92%;
            margin: 30px auto;
            animation: slideUp 0.6s ease;
        }

        /* heading */
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* ===== TOP ACTION BAR ===== */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .add-btn {
            padding: 11px 18px;
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(40,167,69,0.4);
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        th {
            background: #34495e;
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 15px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #444;
        }

        tr {
            transition: all 0.25s ease;
        }

        tr:hover {
            background: #f5f9ff;
            transform: scale(1.01);
        }

        /* ===== BADGE ===== */
        .badge {
            padding: 5px 10px;
            border-radius: 8px;
            background: #e3f2fd;
            color: #1565c0;
            font-size: 13px;
            font-weight: 600;
        }

        /* ===== ACTIONS ===== */
        .action-links {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-links a {
            text-decoration: none;
            font-weight: 600;
            color: #3498db;
        }

        .action-links a:hover {
            text-decoration: underline;
        }

        /* delete button */
        .delete-btn {
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            background: #e74c3c;
            color: white;
            transition: 0.3s ease;
        }

        .delete-btn:hover {
            transform: scale(1.05);
            background: #c0392b;
        }

        /* delete all */
        .delete-all {
            margin-top: 20px;
            text-align: right;
        }

        .delete-all button {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff4d4d, #e60000);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .delete-all button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(231,76,60,0.4);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

    </style>
</head>

<body>

<!-- ===== HEADER ===== -->
<div class="header">
    <a class="dashboard-btn" th:href="@{/dashboard}">🏠 Dashboard</a>
    <h3 style="margin:0; color:#2c3e50;">Doctor Management</h3>
</div>

<div class="container">

    <h2>👨‍⚕️ All Doctors</h2>

    <div class="top-bar">
        <a class="add-btn" th:href="@{/doctors/add}">+ Add New Doctor</a>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Specialization</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>

        <tr th:each="doctor : ${doctors}">
            <td th:text="${doctor.id}"></td>
            <td th:text="${doctor.name}"></td>

            <td>
                <span class="badge" th:text="${doctor.specialization}"></span>
            </td>

            <td th:text="${doctor.phone}"></td>

            <td class="action-links">
                <a th:href="@{'/doctors/' + ${doctor.id}}">View</a>
                <a th:href="@{'/doctors/edit/' + ${doctor.id}}">Edit</a>

                <form th:action="@{'/doctors/delete/' + ${doctor.id}}"
                      method="post"
                      style="display:inline;">
                    <button class="delete-btn"
                            onclick="return confirm('Delete this doctor?')">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
    </table>

    <div class="delete-all">
        <form th:action="@{/doctors/deleteAll}" method="post">
            <button type="submit"
                    onclick="return confirm('Delete ALL doctors?')">
                Delete All Doctors
            </button>
        </form>
    </div>

</div>

</body>
</html>
