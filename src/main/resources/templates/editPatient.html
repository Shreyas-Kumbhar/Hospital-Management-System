<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Patient – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">

<div class="form-card">
    <div class="form-card-header">
        <div class="form-icon">✏️</div>
        <h2>Edit Patient</h2>
        <p>Update the patient's information below</p>
    </div>

    <form th:action="@{'/patients/update/' + ${patient.id}}"
          th:object="${patient}" method="post">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" th:field="*{name}" placeholder="John Doe"/>
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" th:field="*{age}" placeholder="e.g. 35" min="0" max="150"/>
            <div class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" th:field="*{address}" placeholder="123 Main Street, City"/>
            <div class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" th:field="*{email}" placeholder="patient@email.com"/>
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="disease">Diagnosis / Disease</label>
            <input type="text" id="disease" th:field="*{disease}" placeholder="e.g. Hypertension"/>
            <div class="field-error" th:if="${#fields.hasErrors('disease')}" th:errors="*{disease}"></div>
        </div>

        <button class="form-submit blue" type="submit">💾 Update Patient</button>
    </form>

    <div class="form-footer">
        <a class="back-link" th:href="@{/patients/list}">← Back to Patients</a>
    </div>
</div>

</body>
</html>
