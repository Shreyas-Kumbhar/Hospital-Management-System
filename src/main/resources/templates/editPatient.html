<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Patient</title>

    <!-- Updated CSS -->
    <link rel="stylesheet" th:href="@{/css/editPatient.css}">
</head>

<body>

<div class="container">

    <h2>Edit Patient</h2>

    <form th:action="@{'/patients/update/' + ${patient.id}}"
          th:object="${patient}"
          method="post">

        <label>Name:</label>
        <input type="text" th:field="*{name}" />
        <p class="error" th:errors="*{name}"></p>

        <label>Age:</label>
        <input type="number" th:field="*{age}" />
        <p class="error" th:errors="*{age}"></p>

        <label>Address:</label>
        <input type="text" th:field="*{address}" />
        <p class="error" th:errors="*{address}"></p>

        <label>Email:</label>
        <input type="text" th:field="*{email}" />
        <p class="error" th:errors="*{email}"></p>

        <label>Disease:</label>
        <input type="text" th:field="*{disease}" />
        <p class="error" th:errors="*{disease}"></p>

        <button type="submit">Update Patient</button>
    </form>

    <a class="back-link" th:href="@{/patients/list}">← Back to List</a>

</div>

</body>
</html>
