<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Patient</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef5ff, #eaf2ff);
            margin: 0;
            animation: fadeInPage 0.8s ease;
        }

        /* container */
        .container {
            width: 480px;
            margin: 60px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.12);
            transition: all 0.3s ease;
            animation: slideUp 0.6s ease;
        }

        .container:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 55px rgba(0,0,0,0.15);
        }

        /* heading */
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* labels */
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #34495e;
        }

        /* inputs */
        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #dcdcdc;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:hover {
            border-color: #3498db;
        }

        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52,152,219,0.4);
            outline: none;
            transform: scale(1.01);
        }

        /* error */
        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 3px;
            animation: shake 0.3s ease;
        }

        /* button */
        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3498db, #2c80b4);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 20px rgba(52,152,219,0.4);
        }

        button:active {
            transform: scale(0.96);
        }

        /* back link */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .back-link:hover {
            text-decoration: underline;
            letter-spacing: 0.5px;
        }

        /* animations */
        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            50% { transform: translateX(3px); }
            75% { transform: translateX(-3px); }
            100% { transform: translateX(0); }
        }

    </style>
</head>

<body>

<div class="container">

    <h2>🧑‍⚕️ Edit Patient</h2>

    <form th:action="@{'/patients/update/' + ${patient.id}}"
          th:object="${patient}"
          method="post">

        <label>Name</label>
        <input type="text" th:field="*{name}" placeholder="Enter patient name" />
        <p class="error" th:errors="*{name}"></p>

        <label>Age</label>
        <input type="number" th:field="*{age}" placeholder="Enter age" />
        <p class="error" th:errors="*{age}"></p>

        <label>Address</label>
        <input type="text" th:field="*{address}" placeholder="Enter address" />
        <p class="error" th:errors="*{address}"></p>

        <label>Email</label>
        <input type="text" th:field="*{email}" placeholder="Enter email" />
        <p class="error" th:errors="*{email}"></p>

        <label>Disease</label>
        <input type="text" th:field="*{disease}" placeholder="Enter disease" />
        <p class="error" th:errors="*{disease}"></p>

        <button type="submit">Update Patient</button>

    </form>

    <a class="back-link" th:href="@{/patients/list}">← Back to List</a>

</div>

</body>
</html>
