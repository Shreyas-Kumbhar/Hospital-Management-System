<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Patient Profile – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="detail-page">

<div class="detail-card">
    <div class="detail-card-header">
        <div class="detail-icon">🧑</div>
        <h2>Patient Profile</h2>
    </div>

    <div class="detail-accent green">
        <div class="detail-row">
            <span class="detail-label">ID</span>
            <span class="detail-value" th:text="${patient.id}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Name</span>
            <span class="detail-value" th:text="${patient.name}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Age</span>
            <span class="detail-value" th:text="${patient.age}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Address</span>
            <span class="detail-value" th:text="${patient.address}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Email</span>
            <span class="detail-value" th:text="${patient.email}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Disease</span>
            <span class="detail-value">
                <span class="badge badge-red" th:text="${patient.disease}"></span>
            </span>
        </div>
    </div>

    <div class="detail-actions">
        <a class="btn btn-outline" th:href="@{/patients/list}">← Back</a>
        <a class="btn btn-warning" th:href="@{'/patients/edit/' + ${patient.id}}">✏️ Edit</a>
        <a class="btn btn-primary" th:href="@{/dashboard}">🏠 Dashboard</a>
    </div>
</div>

</body>
</html>
