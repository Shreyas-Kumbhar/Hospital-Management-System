<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Details</title>
    <link rel="stylesheet" th:href="@{/css/patientView.css}">
</head>

<body>

<div class="container">

    <h2>Patient Profile</h2>

    <div class="card">

        <p><b>ID:</b> <span th:text="${patient.id}"></span></p>
        <p><b>Name:</b> <span th:text="${patient.name}"></span></p>
        <p><b>Age:</b> <span th:text="${patient.age}"></span></p>
        <p><b>Address:</b> <span th:text="${patient.address}"></span></p>
        <p><b>Email:</b> <span th:text="${patient.email}"></span></p>
        <p><b>Disease:</b> <span th:text="${patient.disease}"></span></p>

    </div>

    <a class="button" th:href="@{/patients/list}">← Back to List</a>

</div>

</body>
</html>
