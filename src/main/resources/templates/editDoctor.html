<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Doctor – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">

<div class="form-card">
    <div class="form-card-header">
        <div class="form-icon">✏️</div>
        <h2>Edit Doctor</h2>
        <p>Update the doctor's information below</p>
    </div>

    <form th:action="@{'/doctors/update/' + ${doctor.id}}"
          th:object="${doctor}" method="post">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Dr. John Smith"/>
        </div>

        <div class="form-group">
            <label for="spec">Specialization</label>
            <input type="text" id="spec" th:field="*{specialization}" placeholder="e.g. Cardiologist"/>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" th:field="*{phone}" placeholder="+1 234 567 8900"/>
        </div>

        <button class="form-submit blue" type="submit">💾 Update Doctor</button>
    </form>

    <div class="form-footer">
        <a class="back-link" th:href="@{/doctors/list}">← Back to Doctors</a>
    </div>
</div>

</body>
</html>
