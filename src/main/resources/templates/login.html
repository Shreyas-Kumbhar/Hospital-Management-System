<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        /* ── Auth-specific overrides ── */
        body.auth-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            animation: fadeUp .45s ease;
        }

        /* Brand header above card */
        .auth-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-brand .brand-logo {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(56,189,248,.5));
        }

        .auth-brand h1 {
            font-size: 22px;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: .5px;
        }

        .auth-brand p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Card */
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 38px 40px 32px;
            box-shadow: 0 24px 64px rgba(0,0,0,.35);
        }

        .auth-card h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .auth-card .subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 26px;
        }

        /* Input groups */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: #1e293b;
            background: #f8fafc;
            outline: none;
            transition: all .25s ease;
        }

        .input-wrap input:focus {
            border-color: #2563eb;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }

        /* Submit button */
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all .25s ease;
            margin-top: 6px;
            letter-spacing: .3px;
        }

        .auth-btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,99,235,.4); }
        .auth-btn:active { transform: scale(.98); }

        /* Alert */
        .auth-alert {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .auth-alert.error   { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .auth-alert.success { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }

        /* Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: #94a3b8;
            font-size: 12px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        /* Footer link */
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }

        .auth-footer a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
            transition: opacity .2s;
        }

        .auth-footer a:hover { opacity: .75; text-decoration: underline; }
    </style>
</head>
<body class="auth-page">

<div class="auth-wrapper">

    <!-- Brand -->
    <div class="auth-brand">
        <span class="brand-logo">🏥</span>
        <h1>Hospital Management System</h1>
        <p>Sign in to access your dashboard</p>
    </div>

    <!-- Card -->
    <div class="auth-card">
        <h2>Welcome back 👋</h2>
        <p class="subtitle">Enter your credentials to continue</p>

        <!-- Error / Success alerts -->
        <div th:if="${errorMsg}" class="auth-alert error">
            <span>⚠️</span> <span th:text="${errorMsg}"></span>
        </div>
        <div th:if="${successMsg}" class="auth-alert success">
            <span>✅</span> <span th:text="${successMsg}"></span>
        </div>

        <!-- Login form -->
        <form th:action="@{/login}" method="post">

            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username" autocomplete="username" required/>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" autocomplete="current-password" required/>
                </div>
            </div>

            <button class="auth-btn" type="submit">🔐 Sign In</button>
        </form>

        <div class="auth-divider">or</div>

        <div class="auth-footer">
            Don't have an account?
            <a th:href="@{/register}">Create one</a>
        </div>
    </div>

</div>

</body>
</html>
