<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Appointment – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">

<div class="form-card">
    <div class="form-card-header">
        <div class="form-icon">✏️</div>
        <h2>Edit Appointment</h2>
        <p>Update appointment details below</p>
    </div>

    <form th:action="@{'/appointment/update/' + ${appointment.id}}"
          th:object="${appointment}" method="post">

        <div class="form-group">
            <label for="date">Appointment Date</label>
            <input type="date" id="date" th:field="*{date}"/>
            <div class="field-error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" th:field="*{status}">
                <option value="Scheduled" th:selected="${appointment.status == 'Scheduled'}">Scheduled</option>
                <option value="Completed" th:selected="${appointment.status == 'Completed'}">Completed</option>
                <option value="Cancelled" th:selected="${appointment.status == 'Cancelled'}">Cancelled</option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>

        <div class="form-group">
            <label for="patient">Patient</label>
            <select id="patient" name="patient">
                <option th:each="p : ${patients}"
                        th:value="${p.id}"
                        th:text="${p.name}"
                        th:selected="${appointment.patient.id == p.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="doctor">Doctor</label>
            <select id="doctor" name="doctor">
                <option th:each="d : ${doctors}"
                        th:value="${d.id}"
                        th:text="${d.name + ' – ' + d.specialization}"
                        th:selected="${appointment.doctor.id == d.id}">
                </option>
            </select>
        </div>

        <button class="form-submit orange" type="submit">💾 Update Appointment</button>
    </form>

    <div class="form-footer">
        <a class="back-link" th:href="@{/appointment/list}">← Back to Appointments</a>
    </div>
</div>

</body>
</html>
