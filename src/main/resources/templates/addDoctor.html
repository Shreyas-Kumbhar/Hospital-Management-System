<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add Doctor – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">

<div class="form-card">
    <div class="form-card-header">
        <div class="form-icon">👨‍⚕️</div>
        <h2>Add New Doctor</h2>
        <p>Fill in the details below to register a doctor</p>
    </div>

    <form th:action="@{/doctors}" th:object="${doctor}" method="post">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Dr. John Smith"/>
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="spec">Specialization</label>
            <input type="text" id="spec" th:field="*{specialization}" placeholder="e.g. Cardiologist"/>
            <div class="field-error" th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"></div>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" th:field="*{phone}" placeholder="+1 234 567 8900"/>
            <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <button class="form-submit green" type="submit">✅ Save Doctor</button>
    </form>

    <div class="form-footer">
        <a class="back-link" th:href="@{/doctors/list}">← Back to Doctors</a>
    </div>
</div>

</body>
</html>
