<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef5ff, #eaf2ff);
            margin: 0;
            animation: fadeInPage 0.8s ease;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .dashboard-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #3498db, #2c80b4);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .dashboard-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(52,152,219,0.4);
        }

        /* ===== CONTAINER ===== */
        .container {
            width: 92%;
            margin: 30px auto;
            animation: slideUp 0.6s ease;
        }

        /* heading */
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .add-btn {
            padding: 11px 18px;
            background: linear-gradient(135deg, #3498db, #2c80b4);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(52,152,219,0.4);
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        th {
            background: #34495e;
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 15px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #444;
        }

        tr {
            transition: all 0.25s ease;
        }

        tr:hover {
            background: #f5f9ff;
            transform: scale(1.01);
        }

        /* ===== STATUS BADGE ===== */
        .status {
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .scheduled {
            background: #fff3cd;
            color: #856404;
        }

        .completed {
            background: #d4edda;
            color: #155724;
        }

        .cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        /* ===== ACTIONS ===== */
        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .actions a {
            text-decoration: none;
            font-weight: 600;
            color: #3498db;
        }

        .actions a:hover {
            text-decoration: underline;
        }

        /* delete button */
        .delete-btn {
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            background: #e74c3c;
            color: white;
            transition: 0.3s ease;
        }

        .delete-btn:hover {
            transform: scale(1.05);
            background: #c0392b;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

    </style>
</head>

<body>

<!-- ===== HEADER ===== -->
<div class="header">
    <a class="dashboard-btn" th:href="@{/dashboard}">🏠 Dashboard</a>
    <h3 style="margin:0; color:#2c3e50;">Appointment Management</h3>
</div>

<div class="container">

    <h2>📅 All Appointments</h2>

    <div class="top-bar">
        <a class="add-btn" th:href="@{/appointment/add}">+ New Appointment</a>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Date</th>
            <th>Status</th>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Actions</th>
        </tr>

        <tr th:each="a : ${appointments}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.date}"></td>

            <td>
                <span class="status"
                      th:text="${a.status}"
                      th:classappend="
                        ${a.status == 'Scheduled'} ? ' scheduled' :
                        (${a.status == 'Completed'} ? ' completed' : ' cancelled')">
                </span>
            </td>

            <td th:text="${a.patient.name}"></td>
            <td th:text="${a.doctor.name}"></td>

            <td class="actions">
                <a th:href="@{'/appointment/search/' + ${a.id}}">View</a>
                <a th:href="@{'/appointment/edit/' + ${a.id}}">Edit</a>

                <form th:action="@{'/appointment/delete/' + ${a.id}}"
                      method="post"
                      style="display:inline;">
                    <button class="delete-btn"
                            onclick="return confirm('Delete this appointment?')">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
