<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Prescriptions</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef5ff, #eaf2ff);
            margin: 0;
            animation: fadeInPage 0.8s ease;
        }

        /* container */
        .container {
            width: 92%;
            margin: 40px auto;
            animation: slideUp 0.6s ease;
        }

        /* heading */
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* reusable buttons */
        .btn {
            padding: 11px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }

        /* dashboard button */
        .dashboard-btn {
            background: linear-gradient(135deg, #34495e, #2c3e50);
            color: white;
        }

        .dashboard-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(44,62,80,0.4);
        }

        /* add button */
        .add-btn {
            background: linear-gradient(135deg, #16a085, #138d75);
            color: white;
        }

        .add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(22,160,133,0.4);
        }

        /* table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        /* header */
        th {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 15px;
        }

        /* cells */
        td {
            padding: 14px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #444;
            transition: 0.2s;
        }

        /* row hover */
        tr {
            transition: all 0.25s ease;
        }

        tr:hover {
            background: #f5f9ff;
            transform: scale(1.01);
        }

        /* badges */
        .badge {
            padding: 5px 10px;
            border-radius: 8px;
            background: #e8f8f5;
            color: #117a65;
            font-size: 13px;
            font-weight: 600;
        }

        /* notes styling */
        .notes {
            display: inline-block;
            max-width: 220px;
            word-wrap: break-word;
            color: #555;
        }

        /* actions */
        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .actions a {
            text-decoration: none;
            font-weight: 600;
            color: #3498db;
            transition: 0.2s;
        }

        .actions a:hover {
            text-decoration: underline;
        }

        /* delete button */
        .delete-btn {
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            background: #e74c3c;
            color: white;
            transition: 0.3s ease;
        }

        .delete-btn:hover {
            transform: scale(1.05);
            background: #c0392b;
        }

        .delete-btn:active {
            transform: scale(0.95);
        }

        /* animations */
        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

    </style>
</head>

<body>

<div class="container">

    <h2>💊 All Prescriptions</h2>

    <div class="top-bar">

        <!-- Dashboard -->
        <a class="btn dashboard-btn" th:href="@{/dashboard}">
            🏠 Dashboard
        </a>

        <!-- Add -->
        <a class="btn add-btn" th:href="@{/prescription/add}">
            + New Prescription
        </a>

    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Medicine</th>
            <th>Dosage</th>
            <th>Notes</th>
            <th>Appointment</th>
            <th>Actions</th>
        </tr>

        <tr th:each="p : ${prescriptions}">
            <td th:text="${p.id}"></td>

            <td>
                <span class="badge" th:text="${p.medicine}"></span>
            </td>

            <td th:text="${p.dosage}"></td>

            <td>
                <span class="notes" th:text="${p.notes}"></span>
            </td>

            <td>
                <span class="badge"
                      th:text="${p.appointment != null ? 'ID: ' + p.appointment.id : 'N/A'}">
                </span>
            </td>

            <td class="actions">
                <a th:href="@{'/prescription/search/' + ${p.id}}">View</a>
                <a th:href="@{'/prescription/edit/' + ${p.id}}">Edit</a>

                <form th:action="@{'/prescription/delete/' + ${p.id}}"
                      method="post"
                      style="display:inline;">
                    <button class="delete-btn"
                            onclick="return confirm('Delete this prescription?')">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
