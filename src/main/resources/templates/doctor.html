<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Details</title>

    <style>
        /* ================= GLOBAL ================= */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef5ff, #eaf2ff);
            margin: 0;
            animation: fadeInPage 0.8s ease;
        }

        /* ================= CONTAINER ================= */
        .container {
            width: 460px;
            margin: 80px auto;
            text-align: center;
            animation: slideUp 0.7s ease;
        }

        /* ================= TITLE ================= */
        h2 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        /* ================= CARD ================= */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.12);
            text-align: left;
            border-left: 6px solid #3498db;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 55px rgba(0,0,0,0.15);
        }

        /* ================= TEXT ================= */
        .card p {
            margin: 14px 0;
            font-size: 15px;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card b {
            color: #2c3e50;
            font-weight: 600;
        }

        .card span {
            font-weight: 500;
            color: #555;
        }

        /* specialization badge */
        .badge {
            background: #e3f2fd;
            color: #1565c0;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            animation: fadeInBadge 0.6s ease;
        }

        /* ================= BUTTONS ================= */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .button {
            flex: 1;
            padding: 12px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Back */
        .back {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .back:hover {
            transform: translateY(-3px);
            background: #dfe6e9;
        }

        /* Dashboard */
        .dashboard {
            background: linear-gradient(135deg, #3498db, #2c80b4);
            color: white;
        }

        .dashboard:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(52,152,219,0.4);
        }

        .dashboard:active {
            transform: scale(0.96);
        }

        /* ================= ANIMATIONS ================= */
        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeInBadge {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h2>👨‍⚕️ Doctor Profile</h2>

    <div class="card">

        <p><b>ID</b> <span th:text="${doctor.id}"></span></p>
        <p><b>Name</b> <span th:text="${doctor.name}"></span></p>

        <p>
            <b>Specialization</b>
            <span class="badge" th:text="${doctor.specialization}"></span>
        </p>

        <p><b>Phone</b> <span th:text="${doctor.phone}"></span></p>

    </div>

    <div class="buttons">
        <a class="button back" th:href="@{/doctors/list}">← Back</a>
        <a class="button dashboard" th:href="@{/dashboard}">🏠 Dashboard</a>
    </div>

</div>

</body>
</html>
