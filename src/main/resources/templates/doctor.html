<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Doctor Profile – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="detail-page">

<div class="detail-card">
    <div class="detail-card-header">
        <div class="detail-icon">👨‍⚕️</div>
        <h2>Doctor Profile</h2>
    </div>

    <div class="detail-accent">
        <div class="detail-row">
            <span class="detail-label">ID</span>
            <span class="detail-value" th:text="${doctor.id}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Name</span>
            <span class="detail-value" th:text="${doctor.name}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Specialization</span>
            <span class="detail-value">
                <span class="badge badge-blue" th:text="${doctor.specialization}"></span>
            </span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Phone</span>
            <span class="detail-value" th:text="${doctor.phone}"></span>
        </div>
    </div>

    <div class="detail-actions">
        <a class="btn btn-outline" th:href="@{/doctors/list}">← Back</a>
        <a class="btn btn-warning" th:href="@{'/doctors/edit/' + ${doctor.id}}">✏️ Edit</a>
        <a class="btn btn-primary" th:href="@{/dashboard}">🏠 Dashboard</a>
    </div>
</div>

</body>
</html>
