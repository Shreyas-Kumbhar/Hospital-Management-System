<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Prescription – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">

<div class="form-card">
    <div class="form-card-header">
        <div class="form-icon">✏️</div>
        <h2>Edit Prescription</h2>
        <p>Update prescription details below</p>
    </div>

    <form th:action="@{'/prescription/edit/' + ${prescription.id}}"
          th:object="${prescription}" method="post">

        <div class="form-group">
            <label for="medicine">Medicine Name</label>
            <input type="text" id="medicine" th:field="*{medicine}" placeholder="e.g. Paracetamol 500mg"/>
            <div class="field-error" th:if="${#fields.hasErrors('medicine')}" th:errors="*{medicine}"></div>
        </div>

        <div class="form-group">
            <label for="dosage">Dosage</label>
            <input type="text" id="dosage" th:field="*{dosage}" placeholder="e.g. 2 times a day"/>
            <div class="field-error" th:if="${#fields.hasErrors('dosage')}" th:errors="*{dosage}"></div>
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <input type="text" id="notes" th:field="*{notes}" placeholder="Additional instructions"/>
            <div class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
        </div>

        <div class="form-group">
            <label for="appointment">Appointment</label>
            <select id="appointment" th:field="*{appointment}">
                <option th:each="a : ${appointments}"
                        th:value="${a}"
                        th:text="'#' + ${a.id} + ' – ' + ${a.patient.name} + ' / ' + ${a.date}">
                </option>
            </select>
        </div>

        <button class="form-submit purple" type="submit">💾 Update Prescription</button>
    </form>

    <div class="form-footer">
        <a class="back-link" th:href="@{/prescription/list}">← Back to Prescriptions</a>
    </div>
</div>

</body>
</html>
