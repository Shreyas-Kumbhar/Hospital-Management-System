<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add Prescription – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">

<div class="form-card">
    <div class="form-card-header">
        <div class="form-icon">💊</div>
        <h2>Create Prescription</h2>
        <p>Link a prescription to an appointment</p>
    </div>

    <!-- Error alert -->
    <div th:if="${error}" class="alert alert-danger">
        ⚠️ <span th:text="${error}"></span>
    </div>

    <form th:action="@{/prescription}" method="post">

        <div class="form-group">
            <label for="medicine">Medicine Name</label>
            <input type="text" id="medicine" name="medicine" placeholder="e.g. Paracetamol 500mg" required/>
        </div>

        <div class="form-group">
            <label for="dosage">Dosage</label>
            <input type="text" id="dosage" name="dosage" placeholder="e.g. 1 tablet twice a day" required/>
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3"
                      placeholder="Any additional instructions..." required></textarea>
        </div>

        <div class="form-group">
            <label for="appointment">Appointment</label>
            <select id="appointment" name="appointment" required>
                <option value="">-- Select Appointment --</option>
                <option th:each="a : ${appointments}"
                        th:value="${a.id}"
                        th:text="'Appointment #' + ${a.id} + ' – ' + ${a.patient.name} + ' / ' + ${a.date}">
                </option>
            </select>
        </div>

        <button class="form-submit teal" type="submit">💊 Save Prescription</button>
    </form>

    <div class="form-footer">
        <a class="back-link" th:href="@{/prescription/list}">← Back to Prescriptions</a>
    </div>
</div>

</body>
</html>
