<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Appointment Details – HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="detail-page">

<div class="detail-card">
    <div class="detail-card-header">
        <div class="detail-icon">📅</div>
        <h2>Appointment Details</h2>
    </div>

    <div class="detail-accent yellow">
        <div class="detail-row">
            <span class="detail-label">ID</span>
            <span class="detail-value" th:text="${appointment.id}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Date</span>
            <span class="detail-value" th:text="${appointment.date}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Status</span>
            <span class="detail-value">
                <span class="badge"
                      th:text="${appointment.status}"
                      th:classappend="${appointment.status == 'Scheduled'} ? ' status-scheduled' :
                                       (${appointment.status == 'Completed'} ? ' status-completed' : ' status-cancelled')">
                </span>
            </span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Patient</span>
            <span class="detail-value" th:text="${appointment.patient.name}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Doctor</span>
            <span class="detail-value" th:text="${appointment.doctor.name}"></span>
        </div>
    </div>

    <div class="detail-actions">
        <a class="btn btn-outline" th:href="@{/appointment/list}">← Back</a>
        <a class="btn btn-warning" th:href="@{'/appointment/edit/' + ${appointment.id}}">✏️ Edit</a>
        <a class="btn btn-primary" th:href="@{/dashboard}">🏠 Dashboard</a>
    </div>
</div>

</body>
</html>
